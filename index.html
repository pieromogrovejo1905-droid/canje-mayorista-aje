<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3b47e0">
<title>Canje Mayorista AJE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/aje.png" type="image/png">
<style>
  :root{--accent:#3b47e0;--lime:#7db843;--bg:#f3f4fb;--card:#fff;--ink:#0b1f4d;--ink2:#4a5275;--line:#e1e4f3;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--accent);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;right:-80px;top:-100px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08)}
  body::after{content:"";position:fixed;left:12%;bottom:-40px;width:90px;height:90px;border-radius:50%;background:var(--lime)}
  .box{width:100%;max-width:420px;position:relative;z-index:1}
  .logos{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .logos .free{height:44px}
  .logos .sep{width:1px;height:42px;background:rgba(255,255,255,.4)}
  .ajebox{background:#fff;border-radius:12px;padding:5px 8px;display:flex}
  .ajebox img{height:36px;display:block}
  h1{color:#fff;margin:0 0 4px;font-size:28px}
  p.lead{color:rgba(255,255,255,.88);margin:0 0 20px}
  a.op{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;text-decoration:none;color:var(--ink);box-shadow:0 10px 30px rgba(11,31,77,.18)}
  a.op .ic{width:48px;height:48px;border-radius:12px;background:#eceefd;color:var(--accent);display:grid;place-items:center;font-size:22px;flex:none}
  a.op b{display:block;font-size:17px}
  a.op span{color:var(--ink2);font-size:13.5px}
  a.op:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
</style>
</head>
<body>
<main class="box">
  <div class="logos"><img class="free" src="img/free-blanco.png" alt="Free"><div class="sep"></div><span class="ajebox"><img src="img/aje.png" alt="AJE"></span></div>
  <h1>Canje Mayorista AJE</h1>
  <p class="lead">Impulso y canjes en mercados mayoristas · Lima</p>
  <a class="op" href="app.html"><span class="ic">📲</span><div><b>Canjistas</b><span>Asistencia, canjes e incidencias desde el celular</span></div></a>
  <a class="op" href="dashboard.html"><span class="ic">📊</span><div><b>Dashboard de la campaña</b><span>Avance por mercado, drop y bebida</span></div></a>
</main>
<script>
  // Si la app está instalada en el celular, abre directo el registro.
  if (matchMedia('(display-mode: standalone)').matches) location.replace('app.html');
</script>
</body>
</html>
